<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acadex — Primary Marks Entry</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <div id="app">

    <header class="app-header">
      <div class="header-brand">
        <span class="brand-logo">Acadex</span>
        <span class="brand-sub">Primary Marks Entry</span>
      </div>
      <button class="nav-menu-btn" id="nav-menu-btn" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <nav class="app-nav">
        <button class="nav-btn active" data-view="setup">Setup</button>
        <button class="nav-btn" data-view="history">History</button>
        <button class="nav-btn" data-view="roster">Roster</button>
        <button class="nav-btn" data-view="entry">Marks Entry</button>
        <button class="nav-btn" data-view="results">Results</button>
      </nav>
    </header>

    <div id="context-bar" class="context-bar hidden"></div>

    <main id="app-main" class="app-main"></main>

    <div id="toast" class="toast hidden"></div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/export.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
